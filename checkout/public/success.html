<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagamento confirmado — Jornal do Reino</title>
    <meta name="theme-color" content="#00095b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/Imagem/logo%20jornal.png" />
    <link rel="preload" href="/assets/fonts/Sandra.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="/assets/css/tema.css" />
    <link rel="stylesheet" href="/checkout/styles/checkout.css" />
  </head>
  <body class="ck-pagina">
    <header class="ck-topo">
      <div class="container ck-topo__inner">
        <a class="ck-marca" href="/">
          <img src="/Imagem/logo%20jornal.png" alt="" width="46" height="36" />
          <span>Jornal do <em>Reino</em></span>
        </a>
        <span class="ck-seguro"><i class="bx bxs-lock-alt"></i> Pagamento 100% seguro</span>
      </div>
    </header>

    <main class="sc">
      <div class="container">
        <div class="sc__caixa" id="caixa">
          <div class="sc__topo">
            <span class="sc__icone sc__icone--espera"><i class="bx bx-loader-alt bx-spin"></i></span>
            <h1>Confirmando pagamento…</h1>
            <p>Aguarde só um instante.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="/checkout/scripts/success.js"></script>
  </body>
</html>
