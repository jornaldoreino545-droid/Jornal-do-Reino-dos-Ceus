<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matéria — Jornal do Reino</title>
    <meta name="theme-color" content="#00095b" />
    <script>/* Abertura em vídeo ao carregar/atualizar ou chegar de fora do site; nas trocas de página, a tela de carregamento (ligar/desligar no dashboard) */try{var n=performance.getEntriesByType("navigation")[0],r=n?n.type==="reload":performance.navigation.type===1,i=document.referrer&&new URL(document.referrer).origin===location.origin;var c={};try{c=JSON.parse(localStorage.getItem("jr-config"))||{}}catch(e){}var ab=!(c.abertura&&c.abertura.ativa===false),ca=!(c.carregamento&&c.carregamento.ativo===false),k=(r||!i)&&ab?"com-abertura":ca?"com-carregando":"";if(k&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add(k)}catch(e){}</script>
    <link rel="icon" href="/Imagem/logo%20jornal.png" />
    <link rel="preload" href="/assets/fonts/Sandra.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="/assets/css/tema.css" />
    <link rel="stylesheet" href="/assets/css/paginas.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="conteudo">
      <article class="materia" id="articleContent" aria-live="polite">
        <div class="container materia__container">
          <div class="skeleton" style="height: 24px; width: 30%; margin-bottom: 16px"></div>
          <div class="skeleton" style="height: 64px; margin-bottom: 24px"></div>
          <div class="skeleton" style="aspect-ratio: 16/9"></div>
        </div>
      </article>

      <section class="secao secao--papel" id="maisNoticias" hidden>
        <div class="container">
          <header class="cabecalho-secao">
            <span class="sobretitulo">Continue lendo</span>
            <h2 class="titulo-secao">Mais notícias</h2>
          </header>
          <div class="grade-noticias" id="maisGrade"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="/assets/js/layout.js"></script>
    <script>
      (function () {
        'use strict';
        var JR = window.JR;
        var container = document.getElementById('articleContent');

        function capitalizar(t) { t = String(t || 'geral'); return t.charAt(0).toUpperCase() + t.slice(1); }

        function formatarData(data) {
          var d = new Date(data + (String(data).length === 10 ? 'T12:00:00' : ''));
          return isNaN(d) ? '' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        }

        // O conteúdo vem do painel: se já for HTML usa como está, senão converte parágrafos.
        function corpo(conteudo) {
          if (!conteudo) return '<p>Conteúdo não disponível.</p>';
          return /<[a-z][\s\S]*>/i.test(conteudo) ? conteudo : JR.textoParaHtml(conteudo);
        }

        function erro(titulo, texto) {
          container.innerHTML = '<div class="container"><div class="estado" style="padding: 100px 20px">' +
            '<i class="bx bx-error-circle"></i><h2 class="titulo-secao" style="margin-bottom: 10px">' + titulo + '</h2>' +
            '<p>' + texto + '</p><a class="btn btn--azul" style="margin-top: 24px" href="/Noticias/index.html">Voltar para Notícias</a></div></div>';
        }

        function renderizar(m) {
          document.title = m.title + ' — Jornal do Reino';
          var url = location.href;
          var img = JR.urlImagem(m.image);

          container.innerHTML =
            '<div class="container materia__container">' +
              '<nav class="migalhas migalhas--escura" aria-label="Você está em"><a href="/">Início</a><span>/</span><a href="/Noticias/index.html">Notícias</a></nav>' +
              '<span class="materia__cat">' + JR.escapar(capitalizar(m.category)) + '</span>' +
              '<h1 class="materia__titulo">' + JR.escapar(m.title || '') + '</h1>' +
              (m.excerpt ? '<p class="materia__linha-fina">' + JR.escapar(m.excerpt) + '</p>' : '') +
              '<div class="materia__meta">' +
                '<span><i class="bx bx-calendar"></i> ' + formatarData(m.date) + '</span>' +
                '<span><i class="bx bx-news"></i> Jornal do Reino</span>' +
              '</div>' +
              (img ? '<figure class="materia__capa"><img src="' + JR.escapar(img) + '" alt="" onerror="this.closest(\'figure\').remove()"></figure>' : '') +
              '<div class="materia__corpo">' + corpo(m.content) + '</div>' +
              '<div class="materia__compartilhar">' +
                '<span>Compartilhe esta matéria:</span>' +
                '<a href="https://wa.me/?text=' + encodeURIComponent((m.title || '') + ' ' + url) + '" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="bx bxl-whatsapp"></i></a>' +
                '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '" target="_blank" rel="noopener" aria-label="Facebook"><i class="bx bxl-facebook"></i></a>' +
                '<button type="button" id="copiarLink" aria-label="Copiar link"><i class="bx bx-link"></i></button>' +
              '</div>' +
              '<a class="btn btn--contorno-azul btn--sm" href="/Noticias/index.html"><i class="bx bx-left-arrow-alt"></i> Voltar para Notícias</a>' +
            '</div>';

          document.getElementById('copiarLink').addEventListener('click', function () {
            var b = this;
            navigator.clipboard.writeText(url).then(function () {
              b.innerHTML = '<i class="bx bx-check"></i>';
              setTimeout(function () { b.innerHTML = '<i class="bx bx-link"></i>'; }, 2000);
            });
          });
        }

        function renderizarMais(lista, atual) {
          var outras = lista.filter(function (n) { return String(n.id) !== String(atual.id); })
            .sort(function (a, b) { return new Date(b.date) - new Date(a.date); })
            .slice(0, 3);
          if (!outras.length) return;
          document.getElementById('maisGrade').innerHTML = outras.map(function (n) {
            return '<a class="noticia" href="/Noticias/noticia.html?id=' + encodeURIComponent(n.id) + '">' +
              '<div class="noticia__img"><img src="' + JR.escapar(JR.urlImagem(n.image) || '/Imagem/logo%20jornal.png') + '" alt="" loading="lazy"></div>' +
              '<div class="noticia__corpo"><time><i class="bx bx-calendar"></i> ' + formatarData(n.date) + '</time>' +
              '<h3>' + JR.escapar(n.title || '') + '</h3>' +
              '<span class="noticia__ler">Ler matéria <i class="bx bx-right-arrow-alt"></i></span></div></a>';
          }).join('');
          document.getElementById('maisNoticias').hidden = false;
        }

        async function carregar() {
          var id = new URLSearchParams(location.search).get('id');
          try {
            var lista = await JR.buscarJSON('/api/site/noticias');
            var m = (lista || []).find(function (x) { return String(x.id) === String(id); });
            if (!m) {
              erro('Matéria não encontrada', 'A matéria que você procura não existe ou foi removida.');
              return;
            }
            renderizar(m);
            renderizarMais(lista, m);
          } catch (e) {
            console.error('Matéria:', e);
            erro('Erro ao carregar', 'Não foi possível carregar a matéria agora. Tente novamente em instantes.');
          }
        }

        carregar();
      })();
    </script>
  </body>
</html>
