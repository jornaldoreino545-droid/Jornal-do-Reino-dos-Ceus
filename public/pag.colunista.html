<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colunistas — Jornal do Reino</title>
    <meta name="description" content="As colunas do mês do Jornal do Reino, escritas por quem fala em nome do Reino." />
    <meta name="theme-color" content="#00095b" />
    <script>/* Abertura em vídeo ao carregar/atualizar ou chegar de fora do site; nas trocas de página, a tela de carregamento (ligar/desligar no dashboard) */try{var n=performance.getEntriesByType("navigation")[0],r=n?n.type==="reload":performance.navigation.type===1,i=document.referrer&&new URL(document.referrer).origin===location.origin;var c={};try{c=JSON.parse(localStorage.getItem("jr-config"))||{}}catch(e){}var ab=!(c.abertura&&c.abertura.ativa===false),ca=!(c.carregamento&&c.carregamento.ativo===false),k=(r||!i)&&ab?"com-abertura":ca?"com-carregando":"";if(k&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add(k)}catch(e){}</script>
    <link rel="icon" href="/Imagem/logo%20jornal.png" />
    <link rel="preload" href="/assets/fonts/Sandra.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" href="/assets/css/tema.css" />
    <link rel="stylesheet" href="/assets/css/paginas.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="conteudo">
      <section class="page-hero">
        <div class="container" data-cfg="colunistas">
          <nav class="migalhas" aria-label="Você está em"><a href="/">Início</a><span>/</span><span>Colunistas</span></nav>
          <span class="sobretitulo">Colunistas do mês</span>
          <h1>Vozes que falam em nome do <span class="destaque">Reino</span></h1>
          <p>Palavras de direção, fé e sabedoria de quem conduz a obra de Deus.</p>
        </div>
      </section>

      <section class="secao secao--papel">
        <div class="container colunas" id="colunistasContainer" aria-live="polite">
          <div class="skeleton" style="height: 320px"></div>
          <div class="skeleton" style="height: 320px"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <!-- Compartilhar (usado quando o navegador não tem compartilhamento nativo) -->
    <div class="compartilhar" id="shareMenu" role="dialog" aria-modal="true" aria-labelledby="shareTitulo" hidden>
      <div class="compartilhar__caixa">
        <div class="compartilhar__topo">
          <h3 id="shareTitulo">Compartilhar coluna</h3>
          <button class="compartilhar__fechar" data-fechar aria-label="Fechar"><i class="bx bx-x"></i></button>
        </div>
        <div class="compartilhar__opcoes">
          <a id="shareWhats" target="_blank" rel="noopener"><i class="bx bxl-whatsapp"></i> WhatsApp</a>
          <a id="shareFace" target="_blank" rel="noopener"><i class="bx bxl-facebook-circle"></i> Facebook</a>
          <button id="shareCopiar" type="button"><i class="bx bx-link"></i> <span>Copiar link</span></button>
        </div>
      </div>
    </div>

    <script src="/assets/js/layout.js"></script>
    <script>
      (function () {
        'use strict';
        var JR = window.JR;
        var container = document.getElementById('colunistasContainer');
        var menu = document.getElementById('shareMenu');

        function linkInstagram(valor) {
          // Ignora o texto de exemplo "@Instagram" que ainda não foi trocado no painel
          if (!valor || /^@?instagram$/i.test(valor.trim())) return '';
          if (/^https?:\/\//.test(valor)) return valor;
          return 'https://www.instagram.com/' + valor.replace(/^@/, '') + '/';
        }

        function cartao(c, i) {
          var id = 'coluna-' + (c.id || i);
          var insta = linkInstagram(c.instagram);
          return '<article class="coluna revelar" id="' + id + '">' +
            '<div class="coluna__foto">' +
              '<img src="' + JR.escapar(JR.urlImagem(c.imagem) || '/Imagem/logo%20jornal.png') + '" alt="' + JR.escapar(c.nome) + '" loading="lazy" onerror="this.onerror=null;this.src=\'/Imagem/logo%20jornal.png\'">' +
            '</div>' +
            '<div class="coluna__corpo">' +
              '<span class="sobretitulo">Coluna: ' + JR.escapar(c.coluna || '') + '</span>' +
              '<h2>' + JR.escapar(c.nome || 'Colunista') + '</h2>' +
              '<div class="coluna__texto is-recolhido" id="' + id + '-texto">' + JR.textoParaHtml(c.conteudo || 'Conteúdo em breve.') + '</div>' +
              '<div class="coluna__acoes">' +
                '<button class="btn btn--azul btn--sm" data-expandir="' + id + '-texto" aria-expanded="false">Ler coluna completa <i class="bx bx-chevron-down"></i></button>' +
                '<button class="btn btn--contorno-azul btn--sm" data-compartilhar="' + id + '" data-titulo="' + JR.escapar((c.coluna || 'Coluna') + ' — ' + (c.nome || '')) + '"><i class="bx bx-share-alt"></i> Compartilhar</button>' +
                (insta ? '<a class="coluna__insta" href="' + JR.escapar(insta) + '" target="_blank" rel="noopener"><i class="bx bxl-instagram"></i> ' + JR.escapar(c.instagram) + '</a>' : '') +
              '</div>' +
            '</div>' +
          '</article>';
        }

        function abrirMenu(titulo, url) {
          var texto = titulo + ' — Jornal do Reino';
          document.getElementById('shareWhats').href = 'https://wa.me/?text=' + encodeURIComponent(texto + ' ' + url);
          document.getElementById('shareFace').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
          var copiar = document.getElementById('shareCopiar');
          copiar.querySelector('span').textContent = 'Copiar link';
          copiar.onclick = function () {
            navigator.clipboard.writeText(url).then(function () {
              copiar.querySelector('span').textContent = 'Link copiado!';
            });
          };
          menu.hidden = false;
        }

        menu.addEventListener('click', function (e) {
          if (e.target === menu || e.target.closest('[data-fechar]')) menu.hidden = true;
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menu.hidden = true; });

        container.addEventListener('click', function (e) {
          var expandir = e.target.closest('[data-expandir]');
          if (expandir) {
            var alvo = document.getElementById(expandir.dataset.expandir);
            var recolhido = alvo.classList.toggle('is-recolhido');
            expandir.setAttribute('aria-expanded', String(!recolhido));
            expandir.firstChild.textContent = recolhido ? 'Ler coluna completa ' : 'Mostrar menos ';
            return;
          }
          var share = e.target.closest('[data-compartilhar]');
          if (share) {
            var url = location.origin + location.pathname + '#' + share.dataset.compartilhar;
            var titulo = share.dataset.titulo;
            if (navigator.share) {
              navigator.share({ title: titulo, url: url }).catch(function () {});
            } else {
              abrirMenu(titulo, url);
            }
          }
        });

        async function carregar() {
          try {
            var dados = await JR.buscarJSON('/api/site/colunistas');
            var lista = JR.ordenar(dados.colunistas || dados || []);
            if (!lista.length) {
              container.innerHTML = '<div class="estado"><i class="bx bx-user-voice"></i>Nenhuma coluna publicada este mês.</div>';
              return;
            }
            container.innerHTML = lista.map(cartao).join('');
            // Esconde "Ler coluna completa" quando o texto já cabe inteiro
            container.querySelectorAll('.coluna__texto').forEach(function (t) {
              if (t.scrollHeight <= t.clientHeight + 30) {
                t.classList.remove('is-recolhido');
                var b = container.querySelector('[data-expandir="' + t.id + '"]');
                if (b) b.hidden = true;
              }
            });
            JR.revelar(container);
            if (location.hash) {
              var alvo = document.querySelector(location.hash);
              if (alvo) alvo.scrollIntoView({ behavior: 'smooth' });
            }
          } catch (erro) {
            console.error('Colunistas:', erro);
            container.innerHTML = '<div class="estado"><i class="bx bx-error-circle"></i>Não foi possível carregar as colunas agora.</div>';
          }
        }

        carregar();
      })();
    </script>
  </body>
</html>
